B2_qmap:
  # ACQUIRED 2026-10-05. Values below are read off the package API, not guessed.
  paper: "Lavertu et al. 2026, Scientific Reports"
  package: qmap-benchmark==0.1.1
  install: "pip install qmap-benchmark"
  tasks: [mic_reg, hc50_reg]
  splits: five_predefined          # QMAPBenchmark(split=0..4)
  n_test_split0: 3650
  training_pool: 18033             # DBAASPDataset()
  leakage_control: train_set_filtering   # NOT corpus partitioning
  clustering:
    tool: blosum45_pairwise        # not MMseqs2
    threshold: 0.6
    gap_open: 5
    gap_extension: 1
    coverage: n/a                  # alignment-based, no coverage parameter
  negative_rule: na_regression
  headline_metric: per_target_regression   # bench.compute_metrics()
  arm: A_only                      # native protocol is not reproducible by bra.splits
  mic_species: "Escherichia coli"  # 2112/3650; alternatives S. aureus 2083, P. aeruginosa 1413
  label_transform: log10
  hc50_coverage: 536               # of 3650 -> exploratory only
  preprocess_bra_canonical:
    drop_non_L_canonical: true     # 1193 rows at split 0 (799 purely D-form)
    collapse_duplicates: median    # 379 sequences collapsed
    n_train_after: 7143
    n_test_after: 1873

